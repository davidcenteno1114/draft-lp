<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">When the software doesn't fit</title>
  <desc id="desc">A clean three-piece white puzzle with a contrasting coral outline puzzle piece angled out of alignment, marked by an X in its center.</desc>


  <!-- Three established puzzle pieces: precise, understated outlines. -->
  <path
    d="M93 82 H387 Q393 82 393 88 V225 Q393 231 387 231 H321
       C325 244 319 255 307 255 C294 255 290 243 295 231
       H231 V291 C244 287 255 294 255 307 C255 321 243 325 231 321
       V387 Q231 393 225 393 H93 Q87 393 87 387 V88 Q87 82 93 82 Z"
    fill="none"
    stroke="#FFFFFF" stroke-width="3.8" stroke-linejoin="round"/>

  <!-- Interlocking seams inside the existing system. -->
  <g stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M231 82 V135 C220 131 209 136 209 149 C209 163 221 167 231 163 V231"/>
    <path d="M87 231 H137 C133 220 137 209 151 209 C165 209 169 221 165 231 H231"/>
  </g>

  <!-- A mismatched fourth piece, slightly rotated and shifted. -->
  <g transform="translate(344 329) rotate(-12)">
    <path
      d="M-69 -69 H-18
         C-23 -82 -16 -94 0 -94 C16 -94 23 -82 18 -69
         H69 V-18
         C81 -23 94 -16 94 0 C94 16 81 23 69 18
         V69 H18
         C23 57 16 46 0 46 C-16 46 -23 57 -18 69
         H-69 V18
         C-81 23 -94 16 -94 0 C-94 -16 -81 -23 -69 -18
         Z"
      fill="none"
      stroke="#EF5D4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mismatch indicator: line-only X centered within the red piece. -->
    <path d="M-16 -16 L16 16 M16 -16 L-16 16" stroke="#EF5D4A" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
