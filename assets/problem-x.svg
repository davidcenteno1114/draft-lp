<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 124 128" width="248" height="256" role="img" aria-label="Problem">
  <title>Problem</title>
  <defs>
    <clipPath id="tile-clip">
      <rect x="10" y="8" width="78" height="80" rx="20"/>
    </clipPath>
    <linearGradient id="sheen" x1="10" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- orange dot behind the glass -->
  <circle cx="19" cy="21" r="23" fill="#F2853F"/>

  <!-- glass tile -->
  <g filter="url(#shadow)">
    <rect x="10" y="8" width="78" height="80" rx="20" fill="#2A2824" fill-opacity="0.34"/>
  </g>
  <!-- the dot seen through frosted glass -->
  <g clip-path="url(#tile-clip)">
    <rect x="10" y="8" width="78" height="80" fill="#170D0B" fill-opacity="0.55"/>
    <circle cx="19" cy="21" r="23" fill="#F2853F" filter="url(#frost)" opacity="0.95"/>
    <rect x="10" y="8" width="78" height="80" fill="#2A2824" fill-opacity="0.34"/>
    <rect x="10" y="8" width="78" height="80" fill="url(#sheen)"/>
  </g>
  <!-- edge + top highlight -->
  <rect x="10.5" y="8.5" width="77" height="79" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <path d="M30 9.2h38" stroke="#FFFFFF" stroke-opacity="0.09" stroke-linecap="round"/>

  <!-- X -->
  <path d="M39 38L59 58M59 38L39 58" fill="none" stroke="#F2853F" stroke-width="4" stroke-linecap="round"/>
</svg>
